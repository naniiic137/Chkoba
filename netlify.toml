# Old home on Netlify: everything forwards to the Cloudflare Pages site (the query string,
# e.g. ?room=CODE, is kept). The static build below is only a fallback. No build step.
[build]
  command = "echo static site, no build"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/*"
  to = "https://chkooba.pages.dev/:splat"
  status = 301
  force = true
